name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day，UTC 00:00
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    # 独立仓库（非 fork）⇒ 不能用 Fork-Sync action 的 fork 判断，改为原生命令 merge。
    # 上游：huilang-me/CF-Server-Monitor。用 merge 不用 force push，避免冲掉本地改动。
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游无新提交"
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          git merge upstream/main --no-edit -m "chore: 同步上游 huilang-me/CF-Server-Monitor"
          git push origin main
          echo "已同步上游提交"

      - name: Sync summary
        run: echo "has_new_commits=${{ steps.sync.outputs.has_new_commits }}"
